<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><meta name="description" content="Alim Chat"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>Alim Chat</title></head><body>
<main id="loginScreen" class="login"><div class="logo">A</div><h1>Alim Chat</h1><p>Pesan lebih dekat, kapan saja.</p><button id="googleLogin">🌐　Lanjutkan dengan Google</button><small>Masuk dengan akun Google untuk mulai mengobrol.</small><div id="loginError" class="error"></div></main>
<main id="appScreen" class="app hidden"><header><b>Alim Chat</b><div><button id="installBtn" class="hidden">⬇</button><button id="profileBtn"><img id="myAvatar" alt="Profil"></button></div></header><nav><button class="tab active" data-tab="chats">CHAT</button><button class="tab" data-tab="status">STATUS</button><button class="tab" data-tab="calls">PANGGILAN</button></nav>
<section id="chatsView" class="view"><input id="searchInput" class="search" placeholder="⌕  Cari pesan"><p class="label">RUANG OBROLAN</p><button id="lobbyRow" class="chatrow"><span class="avatar">A</span><span class="chatinfo"><b>Obrolan Umum</b><small id="lastPreview">Mulai percakapan pertama…</small></span><time id="lastTime"></time></button><p class="hint">Versi awal memakai satu ruang obrolan bersama.</p></section>
<section id="statusView" class="view empty hidden"><h2>Status</h2><p>Fitur status belum diaktifkan.</p></section><section id="callsView" class="view empty hidden"><h2>Panggilan</h2><p>Panggilan suara/video belum tersedia.</p></section>
<section id="profileView" class="profile hidden"><button id="closeProfile">← Kembali</button><img id="profileAvatar" alt="Foto"><h2 id="profileName"></h2><p id="profileEmail"></p><button id="logoutBtn">Keluar</button></section>
<section id="roomView" class="room hidden"><header><button id="backBtn">‹</button><span class="avatar">A</span><b>Obrolan Umum</b><button id="roomMenu">⋮</button></header><div id="messages" class="messages"><p id="loadingMessages">Memuat pesan…</p></div><form id="messageForm"><button type="button" id="emojiBtn">☺</button><textarea id="messageInput" maxlength="2000" placeholder="Ketik pesan" required></textarea><button id="sendBtn" class="send">➤</button></form><div id="roomError" class="error"></div></section></main><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="./firebase-config.js"></script><script src="./app.js"></script></body></html>
